<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AlgoLab XR — Belajar Algoritma Immersive</title>
<style>
:root{--card:rgba(18,26,60,.88);--fg:#eef2ff;--mut:#a9b4e6;--ac:#5b8cff;--ok:#3ddc97;--bad:#ff8a8a;--bd:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--card:rgba(255,255,255,.93);--fg:#141a3d;--mut:#4a5588;--bd:rgba(20,26,61,.18)}}
:root[data-theme="light"]{--card:rgba(255,255,255,.93);--fg:#141a3d;--mut:#4a5588;--bd:rgba(20,26,61,.18)}
html,body{height:100%;margin:0;background:#0f1530;color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;left:8px;right:8px;z-index:5}
#top{top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#bot{bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--fg)}
.pill b{color:var(--ac)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#acts button{background:var(--ac);color:#fff;border:0;font-weight:600}
#txt{font-size:14px}
#ai{margin-top:6px;padding:8px 10px;border-radius:10px;border:1px dashed var(--bd);color:var(--mut);max-height:120px;overflow:auto;white-space:pre-wrap;font-size:13px}
#ai:empty{display:none}
#chat{display:flex;gap:6px;margin-top:8px}
#q{flex:1;min-width:0;font:inherit;padding:7px 10px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg)}
.chip{opacity:.45}.chip.act{opacity:1;color:var(--ac)}.chip.ok{opacity:1;color:var(--ok)}
#exit{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:9;display:none}
body.stereo .hud{display:none}body.stereo #exit{display:block}
#msg{font-size:12px;color:var(--mut);margin-top:4px}
</style></head><body>
<video id="vid" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<button id="exit">✕ Keluar VR</button>
<div id="top" class="hud">
 <span class="pill">🧪 <b>AlgoLab XR</b></span>
 <button data-m="3d" class="on">🖥️ 3D</button><button data-m="ar">📷 AR</button><button data-m="vr">🥽 VR</button>
 <span class="pill" id="tm">⏱ 00:00 / ±15 mnt</span>
 <span class="pill"><span class="chip" data-s="1">1 Manipulasi</span> · <span class="chip" data-s="2">2 Keputusan</span> · <span class="chip" data-s="3">3 Pencarian</span> · <span class="chip" data-s="4">4 Rekap AI</span></span>
</div>
<div id="bot" class="hud">
 <div id="txt"></div><div id="acts"></div><div id="ai"></div>
 <div id="chat"><input id="q" placeholder="Tanya AI Tutor tentang algoritma…"><button id="send">Kirim</button></div>
 <div id="msg"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),C={b:0x5b8cff,s:0xffb347,o:0xff7043,g:0x3ddc97};
const R=new T.WebGLRenderer({canvas:$('#c'),antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new T.Scene(),cam=new T.PerspectiveCamera(55,1,.1,100);S.add(cam);
S.add(new T.HemisphereLight(0xffffff,0x223355,1.1));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(3,6,4);S.add(dl);
const floor=new T.Mesh(new T.CircleGeometry(7,48).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x1b2552}));
const grid=new T.GridHelper(14,28,0x3a4a99,0x26306b);grid.position.y=.01;
const rig=new T.Group(),world=new T.Group(),ui3=new T.Group();rig.add(floor,grid,world,ui3);S.add(rig);ui3.visible=false;
const ret=new T.Mesh(new T.RingGeometry(.015,.025,24),new T.MeshBasicMaterial({color:0xffffff,depthTest:false}));ret.position.z=-1;ret.renderOrder=9;ret.visible=false;cam.add(ret);
let mode='3d',stereo=false,yaw=.3,pitch=.35,ori=null,step=0,A=[],sel=null,btn3=[];
const M={sw:0,bm:0,bs:0,st:0};let bi=0,bj=0,bs={};

/* ---------- util tekstur 3D ---------- */
function mkTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);const t=new T.CanvasTexture(c);t.userData={x,w,h,fn};return t}
function numTex(v){return mkTex(128,128,(x)=>{x.fillStyle='#fff';x.font='bold 84px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(v,64,68)})}
function wrap(x,t,mw,lh,y0){const ws=t.split(' ');let l='',y=y0;for(const w of ws){const n=l?l+' '+w:w;if(x.measureText(n).width>mw&&l){x.fillText(l,24,y);l=w;y+=lh}else l=n}x.fillText(l,24,y)}
let ptxt='';const ptex=mkTex(1024,300,()=>{});const panel=new T.Mesh(new T.PlaneGeometry(4.6,1.35),new T.MeshBasicMaterial({map:ptex,transparent:true}));panel.position.set(0,3.9,0);ui3.add(panel);
function panelText(t){ptxt=t;const x=ptex.userData.x;x.clearRect(0,0,1024,300);x.fillStyle='rgba(18,26,60,.9)';x.fillRect(0,0,1024,300);x.fillStyle='#fff';x.font='34px sans-serif';x.textBaseline='top';wrap(x,t.slice(0,230),976,42,20);ptex.needsUpdate=true}

/* ---------- UI helper ---------- */
function say(t){$('#txt').textContent=t;panelText(t)}
function acts(l){const d=$('#acts');d.innerHTML='';btn3.forEach(b=>ui3.remove(b));btn3=[];l.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a.t;b.onclick=a.f;d.appendChild(b);
 const tx=mkTex(300,100,(x,w,h)=>{x.fillStyle='#5b8cff';x.beginPath();x.roundRect?x.roundRect(4,4,w-8,h-8,22):x.rect(4,4,w-8,h-8);x.fill();x.fillStyle='#fff';x.font='bold 34px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(a.t,w/2,h/2+2)});
 const m=new T.Mesh(new T.PlaneGeometry(1.5,.5),new T.MeshBasicMaterial({map:tx,transparent:true}));m.position.set((i-(l.length-1)/2)*1.7,2.8,0);m.userData.fn=a.f;ui3.add(m);btn3.push(m)})}
function chips(){document.querySelectorAll('.chip').forEach(c=>{const s=+c.dataset.s;c.className='chip'+(s<step?' ok':s===step?' act':'')})}
async function ai(p,fb){const box=$('#ai');box.textContent='🤖 AI Tutor berpikir…';
 try{const s=await(window.claude&&claude.use?claude.use('sample'):null);if(!s)throw 0;
  const r=await s('Kamu AI Tutor mata kuliah Algoritma dan Pemrograman. Jawab Bahasa Indonesia, ramah, ringkas, tanpa heading.\n\n'+p,{cache:false,onText:({text})=>{box.textContent='🤖 '+text}});
  box.textContent='🤖 '+r.text;if(ui3.visible)panelText('🤖 '+r.text)}catch(e){box.textContent='🤖 '+(fb||'AI Tutor belum tersedia di sesi ini. Coba lagi nanti.');if(ui3.visible)panelText(box.textContent)}}

/* ---------- objek & tata letak ---------- */
function build(v){while(world.children.length)world.remove(world.children[0]);
 A=v.map(n=>{const h=n*.22,m=new T.Mesh(new T.BoxGeometry(.8,h,.8),new T.MeshStandardMaterial({color:C.b,transparent:true}));m.position.y=h/2;
  const s=new T.Sprite(new T.SpriteMaterial({map:numTex(n),depthTest:false}));s.scale.set(.75,.75,1);s.position.y=h/2+.45;m.add(s);world.add(m);return{v:n,m}});lay(1);paint()}
function lay(snap){A.forEach((b,i)=>{b.m.userData.tx=(i-(A.length-1)/2)*1.1;if(snap)b.m.position.x=b.m.userData.tx})}
function paint(){A.forEach(b=>{b.m.material.color.setHex(b.c||C.b);b.m.material.opacity=b.dim?.25:1})}
function swp(i,j){[A[i],A[j]]=[A[j],A[i]];lay(0)}
const sorted=()=>A.every((b,i)=>!i||A[i-1].v<=b.v);
const inv=a=>{let c=0;a.forEach((x,i)=>a.slice(i+1).forEach(y=>{if(x>y)c++}));return c};

/* ---------- Misi ---------- */
function m0(){step=0;chips();Object.assign(M,{sw:0,bm:0,bs:0,st:0});build([5,2,8,1,9,3]);$('#ai').textContent='';
 say('Selamat datang di AlgoLab XR! Pilih mode 3D, AR (kamera) atau VR di atas, lalu mulai. Ada 3 misi interaktif (±15 menit). Putar pemandangan dengan drag.');acts([{t:'▶ Mulai Misi 1',f:m1}])}
function m1(){step=1;chips();M.sw=0;sel=null;build([5,2,8,1,9,3]);u1();
 acts([{t:'💡 Petunjuk AI',f:()=>ai(`Array saat ini: [${A.map(b=>b.v)}]. Mahasiswa mengurutkan naik dengan menukar dua balok. Beri petunjuk strategi (tanpa jawaban langsung), maksimal 3 kalimat.`)}])}
const u1=()=>say(`Misi 1 · Manipulasi objek: urutkan balok dari terkecil ke terbesar. Klik satu balok, lalu balok lain untuk menukarnya. Penukaran: ${M.sw}`);
function m2(){step=2;chips();M.bm=0;build([4,2,7,1,5]);bi=0;bj=0;b2();$('#ai').textContent=''}
function b2(){const n=A.length;if(bi>=n-1){A.forEach(b=>{b.c=C.g;b.dim=0});paint();return m3intro()}
 A.forEach(b=>{b.c=b.dn?C.g:C.b});A[bj].c=A[bj+1].c=C.o;paint();
 say(`Misi 2 · Keputusan — Pass ${bi+1}: bandingkan ${A[bj].v} dan ${A[bj+1].v}. Perlu ditukar agar urut naik?`);
 acts([{t:'🔁 Tukar',f:()=>d2(true)},{t:'✋ Biarkan',f:()=>d2(false)}])}
function d2(x){const a=A[bj].v,b=A[bj+1].v,need=a>b;
 if(x!==need){M.bm++;return ai(`Bubble sort urut naik. Mahasiswa memutuskan ${x?'MENUKAR':'MEMBIARKAN'} ${a} dan ${b}, padahal itu keliru. Jelaskan maksimal 3 kalimat kenapa, tanpa menghakimi.`,need?`Karena ${a} > ${b}, posisinya terbalik untuk urutan naik, jadi harus ditukar.`:`Karena ${a} ≤ ${b}, sudah benar urutannya, jadi tidak perlu ditukar.`)}
 if(need)swp(bj,bj+1);bj++;if(bj>A.length-2-bi){A[A.length-1-bi].dn=1;bi++;bj=0}
 acts([]);setTimeout(b2,need?650:150)}
function m3intro(){say(`✅ Bubble sort selesai dengan ${M.bm} keputusan keliru. Lanjut ke pencarian.`);acts([{t:'Lanjut Misi 3 ▶',f:m3}]);
 ai(`Mahasiswa menyelesaikan simulasi bubble sort dengan ${M.bm} kesalahan keputusan. Beri umpan balik singkat dan jelaskan kompleksitas O(n²) dalam 3 kalimat.`)}
function m3(){step=3;chips();M.bs=0;M.st=0;build([3,8,12,17,23,31,42,56,70]);const ix=[0,1,2,3,5,6,7,8];bs={lo:0,hi:8,t:A[ix[Math.floor(Math.random()*8)]].v,ph:'p'};b3();$('#ai').textContent=''}
function b3(){const{lo,hi}=bs;A.forEach((b,i)=>{b.dim=i<lo||i>hi;b.c=C.b});paint();
 say(`Misi 3 · Binary Search — cari ${bs.t}. Rentang aktif: indeks ${lo}–${hi}. Klik elemen TENGAH rentang untuk memeriksanya.`);acts([])}
function d3(dir){const mid=bs.mid,need=A[mid].v>bs.t?'L':'R';
 if(dir!==need){M.bs++;return ai(`Binary search pada array terurut naik, target ${bs.t}, nilai tengah ${A[mid].v}. Mahasiswa memilih ${dir==='L'?'KIRI':'KANAN'}, padahal keliru. Jelaskan maksimal 3 kalimat.`,`Array terurut: jika nilai tengah ${need==='L'?'lebih besar':'lebih kecil'} dari target, target pasti ada di sisi ${need==='L'?'kiri':'kanan'}.`)}
 if(need==='L')bs.hi=mid-1;else bs.lo=mid+1;bs.ph='p';b3()}
function m4(){step=4;chips();say('🎉 Semua misi selesai! AI Tutor menyusun rekap & soal latihan untuk Anda…');acts([{t:'🔄 Ulangi dari awal',f:m0}]);
 ai(`Rekap belajar mahasiswa: Misi 1 menukar manual ${M.sw} kali (inversi awal ${inv([5,2,8,1,9,3])}); Misi 2 bubble sort, ${M.bm} keputusan keliru; Misi 3 binary search ${M.st} langkah, ${M.bs} kesalahan. Tulis: (1) evaluasi 2 kalimat, (2) pseudocode bubble sort singkat, (3) 2 soal latihan baru bertingkat. Maksimal 150 kata.`,`Rekap: Misi 1 ${M.sw} penukaran, Misi 2 ${M.bm} kesalahan, Misi 3 ${M.st} langkah/${M.bs} kesalahan. Latihan: urutkan [6,3,9,1] dengan bubble sort; cari 17 dengan binary search pada [2,5,8,11,14,17,20].`)}

function onBar(i){
 if(step===1){if(sel===null){sel=i;A[i].c=C.s;paint()}else if(sel===i){A[i].c=0;sel=null;paint()}else{swp(sel,i);A[sel].c=A[i].c=0;sel=null;M.sw++;paint();u1();
   if(sorted()){A.forEach(b=>b.c=C.g);paint();say(`✅ Terurut dalam ${M.sw} penukaran! Itu inti dari algoritma sorting.`);acts([{t:'Lanjut Misi 2 ▶',f:m2}]);
    ai(`Mahasiswa mengurutkan [5,2,8,1,9,3] manual dengan ${M.sw} penukaran; jumlah inversi awal ${inv([5,2,8,1,9,3])}. Beri apresiasi dan hubungkan dengan konsep bubble sort dalam 3 kalimat.`)}}}
 else if(step===2){if(i===bj||i===bj+1)d2(true)}
 else if(step===3&&bs.ph==='p'){const mid=Math.floor((bs.lo+bs.hi)/2);
  if(i<bs.lo||i>bs.hi)return;
  if(i!==mid){M.bs++;return ai(`Binary search: rentang indeks ${bs.lo}–${bs.hi}, tengahnya indeks ${mid}. Mahasiswa memilih indeks ${i}. Jelaskan maksimal 3 kalimat mengapa harus elemen tengah.`,`Binary search selalu memeriksa elemen tengah (indeks ${mid}) agar rentang pencarian terbelah dua tiap langkah.`)}
  M.st++;bs.mid=mid;A[mid].c=C.s;paint();
  if(A[mid].v===bs.t){A[mid].c=C.g;paint();say(`✅ Ketemu! ${bs.t} ada di indeks ${mid} setelah ${M.st} langkah.`);acts([{t:'Lanjut ke Rekap AI ▶',f:m4}])}
  else{bs.ph='d';say(`Nilai tengah = ${A[mid].v}. Dibanding target ${bs.t}, ke mana pencarian dilanjutkan?`);acts([{t:'◀ Kiri',f:()=>d3('L')},{t:'Kanan ▶',f:()=>d3('R')}])}}}

/* ---------- picking ---------- */
const ray=new T.Raycaster();
function hit(){const o=[...A.map(b=>b.m),...(ui3.visible?btn3:[])];return ray.intersectObjects(o,false)[0]}
function act(h){if(!h)return;const o=h.object;if(o.userData.fn)o.userData.fn();else{const i=A.findIndex(b=>b.m===o);if(i>=0)onBar(i)}}
const cv=$('#c');let dn=null;
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,yw:yaw,pt:pitch}});
cv.addEventListener('pointermove',e=>{if(!dn||R.xr.isPresenting)return;yaw=dn.yw-(e.clientX-dn.x)*.006;pitch=Math.max(-.2,Math.min(1.2,dn.pt+(e.clientY-dn.y)*.004))});
cv.addEventListener('pointerup',e=>{if(!dn)return;const mv=Math.hypot(e.clientX-dn.x,e.clientY-dn.y);dn=null;if(mv>6)return;
 const nd=stereo?new T.Vector2(0,0):new T.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(nd,cam);act(hit())});
const ctrl=R.xr.getController(0);S.add(ctrl);ctrl.addEventListener('select',()=>{const m=new T.Matrix4().extractRotation(ctrl.matrixWorld);ray.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(m);act(hit())});

/* ---------- mode 3D / AR / VR ---------- */
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('#vid').style.display='none'}
async function xr(k){try{if(!navigator.xr||!await navigator.xr.isSessionSupported('immersive-'+k))return false;
 const s=await navigator.xr.requestSession('immersive-'+k,{optionalFeatures:['local-floor']});R.xr.enabled=true;await R.xr.setReferenceSpaceType('local');await R.xr.setSession(s);
 S.background=null;floor.visible=grid.visible=k==='vr';rig.scale.setScalar(k==='ar'?.3:.6);rig.position.set(0,k==='ar'?-.4:-1,k==='ar'?-1.2:-3.5);ui3.visible=true;
 s.addEventListener('end',()=>{R.xr.enabled=false;rig.position.set(0,0,0);setMode('3d')});return true}catch(e){return false}}
async function setMode(m){stopCam();stereo=false;document.body.classList.remove('stereo');ret.visible=false;mode=m;
 document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 floor.visible=grid.visible=m!=='ar';S.background=m==='ar'?null:new T.Color(0x0f1530);rig.scale.setScalar(m==='ar'?.7:1);rig.position.set(0,0,0);ui3.visible=false;$('#msg').textContent='';
 if(m==='ar'){if(await xr('ar'))return $('#msg').textContent='AR WebXR aktif.';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#vid');v.srcObject=stream;v.style.display='block';$('#msg').textContent='AR kamera aktif: arahkan kamera ke meja; drag untuk memutar objek.'}
  catch(e){$('#msg').textContent='Kamera tidak diizinkan/tersedia — AR berjalan tanpa latar kamera.'}}
 if(m==='vr'){if(await xr('vr'))return;stereo=true;document.body.classList.add('stereo');ret.visible=true;ui3.visible=true;rig.scale.setScalar(.6);
  try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission()}catch(e){}
  yaw=.3;pitch=.35}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));$('#exit').onclick=()=>setMode('3d');
addEventListener('deviceorientation',e=>{if(e.alpha!=null)ori=e});
const zee=new T.Vector3(0,0,1),eu=new T.Euler(),q0=new T.Quaternion(),q1=new T.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5)),D=Math.PI/180;

/* ---------- loop ---------- */
const tmp=new T.Vector3(),t0=Date.now();
function loop(){const w=innerWidth,h=innerHeight;
 A.forEach(b=>{b.m.position.x+=(b.m.userData.tx-b.m.position.x)*.18});
 [panel,...btn3].forEach(o=>{cam.getWorldPosition(tmp);o.lookAt(tmp)});
 const s=Math.floor((Date.now()-t0)/1000);$('#tm').textContent=`⏱ ${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')} / ±15 mnt`;
 if(R.xr.isPresenting){R.render(S,cam);return}
 R.setSize(w,h,false);
 if(stereo){cam.position.set(0,1.5,5.2);if(ori){eu.set(ori.beta*D,ori.alpha*D,-ori.gamma*D,'YXZ');cam.quaternion.setFromEuler(eu).multiply(q1).multiply(q0.setFromAxisAngle(zee,-((screen.orientation&&screen.orientation.angle)||0)*D))}else cam.rotation.set(.35-pitch,yaw-.3,0,'YXZ')}
 else{const d=mode==='ar'?7:9;cam.position.set(Math.sin(yaw)*Math.cos(pitch)*d,1+Math.sin(pitch)*d,Math.cos(yaw)*Math.cos(pitch)*d);cam.lookAt(0,1,0)}
 if(stereo){R.setScissorTest(true);cam.aspect=w/2/h;cam.updateProjectionMatrix();cam.updateMatrixWorld();const r=new T.Vector3().setFromMatrixColumn(cam.matrixWorld,0),p=cam.position.clone();
  [-1,1].forEach((e,i)=>{cam.position.copy(p).addScaledVector(r,e*.06);R.setViewport(i*w/2,0,w/2,h);R.setScissor(i*w/2,0,w/2,h);R.render(S,cam)});cam.position.copy(p);R.setScissorTest(false)}
 else{R.setViewport(0,0,w,h);cam.aspect=w/h;cam.updateProjectionMatrix();R.render(S,cam)}}
R.setAnimationLoop(loop);

$('#send').onclick=()=>{const q=$('#q').value.trim();if(!q)return;$('#q').value='';ai(`Konteks: mahasiswa sedang di misi ${step} (1=tukar manual, 2=bubble sort, 3=binary search). Pertanyaan: ${q}\nJawab maksimal 4 kalimat dengan contoh singkat bila perlu.`)};
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')$('#send').click()});
m0();
</script></body></html>
